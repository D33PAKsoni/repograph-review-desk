name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest --cov=repograph --cov-report=term-missing
      - name: CLI smoke test
        run: |
          repograph version
          repograph init .
          repograph index .
          repograph status . --json
          repograph arch --root . --json > /dev/null
          repograph impact src/repograph/impact.py --json > /dev/null
