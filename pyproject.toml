[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repograph-codeintel"
version = "0.1.0"
description = "Evidence-backed codebase intelligence and change-impact analysis for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RepoGraph contributors"}]
keywords = ["code-intelligence", "code-graph", "mcp", "change-impact", "dependency-graph", "static-analysis", "tree-sitter", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "mcp>=2.0,<3",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
repograph = "repograph.cli:main"

[project.urls]
Homepage = "https://github.com/INDEX0-RESEARCH-LABS/repograph"
Documentation = "https://github.com/INDEX0-RESEARCH-LABS/repograph/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures/*"]
addopts = "-q"

[tool.coverage.run]
source = ["repograph"]
omit = ["*/tests/*"]
